# AgentCouncil 一键部署：API 服务 + Milvus standalone（etcd / minio / milvus）
#
# 用法：
#   docker compose up -d --build          # 启动全部服务（首次会下载 bge 权重）
#   python data/ingest.py                 # 宿主机执行，向 Milvus 建研报知识库
#   curl http://127.0.0.1:8000/health     # 存活检查
#   curl http://127.0.0.1:8000/metrics    # Prometheus 指标
#
# 说明：
# - etcd / minio 的镜像 tag 取自 Milvus 官方 standalone docker-compose
#   （v3.0.0 分支）中的依赖服务定义；若本地拉取失败，请按 Milvus 官方
#   文档替换为对应版本 tag（milvus 本体与 README 保持一致，用 v3.0.0）。
# - MILVUS_HOST 在 compose 网络内为服务名 standalone；宿主机执行
#   data/ingest.py 时仍用 .env 里的 localhost（端口已映射到 19530）。
services:
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - ./volumes/etcd:/etcd
    command: >
      etcd -advertise-client-urls=http://etcd:2379
      -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - ./volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v3.0.0
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    ports:
      - "19530:19530"   # gRPC（pymilvus 连接端口）
      - "9091:9091"     # 健康检查 / metrics
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      start_period: 90s
      retries: 3
    depends_on:
      - etcd
      - minio
    restart: unless-stopped

  api:
    container_name: agentcouncil-api
    build: .
    env_file:
      - .env
    environment:
      # compose 网络内通过服务名访问 Milvus（覆盖 .env 中的 localhost）
      MILVUS_HOST: standalone
      HF_HOME: /models/hf
    ports:
      - "8000:8000"
    volumes:
      # 持久化 bge 权重缓存，避免容器重建后重复下载
      - ./volumes/hf:/models/hf
    depends_on:
      - standalone
    restart: unless-stopped